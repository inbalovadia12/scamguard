<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vardin Scam Guard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f8fafc;
      color: #0f172a;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 16px;
      background: linear-gradient(135deg, #0d9488, #0f766e);
      color: white;
    }
    .header .logo { font-size: 24px; }
    .header h1 { font-size: 18px; font-weight: 700; }
    .kid-mode-card {
      margin: 12px;
      padding: 12px;
      border-radius: 12px;
      background: #e0f2fe;
      border: 1px solid #7dd3fc;
    }
    .kid-mode-card.active {
      background: #dbeafe;
      border-color: #60a5fa;
    }
    .kid-mode-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .kid-mode-row input { width: 18px; height: 18px; accent-color: #2563eb; }
    .kid-mode-row label { font-size: 14px; font-weight: 600; cursor: pointer; }
    .kid-desc { font-size: 12px; color: #64748b; margin-top: 6px; margin-left: 26px; }
    .scan-btn {
      display: block;
      width: calc(100% - 24px);
      margin: 0 12px 12px;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #0d9488, #0f766e);
      color: white;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .scan-btn:hover { opacity: 0.9; }
    .scan-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    #result { padding: 0 12px 12px; font-size: 13px; }
    .result-safe { color: #16a34a; font-weight: 600; }
    .result-warning { color: #ea580c; font-weight: 600; }
    .result-danger { color: #dc2626; font-weight: 600; }
    .loading { color: #64748b; }
    .footer {
      padding: 8px 12px;
      text-align: center;
      font-size: 11px;
      color: #94a3b8;
      border-top: 1px solid #e2e8f0;
    }
    .footer a { color: #0d9488; text-decoration: none; }
  </style>
</head>
<body>
  <div class="header">
    <span class="logo">🛡️</span>
    <h1>Vardin Scam Guard</h1>
  </div>

  <div class="kid-mode-card" id="kidModeCard">
    <div class="kid-mode-row">
      <input type="checkbox" id="kidMode">
      <label for="kidMode">🧒 Kid Mode</label>
    </div>
    <p class="kid-desc">Simpler language and extra protection for kids</p>
  </div>

  <button class="scan-btn" id="scanBtn">🔍 Scan this page</button>
  <div id="result"></div>

  <div class="footer">
    <a href="https://vardin.app" target="_blank">Open Vardin App</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
